# 放到平台所在服务器的:
#   - 全局: /etc/pip.conf
#   - 或当前用户: ~/.pip/pip.conf  (有的系统是 ~/.config/pip/pip.conf)
#
# 把 NEXUS_HOST 换成离线服务器的内网 IP 或主机名。

[global]
index-url = http://NEXUS_HOST:7012/repository/pypi-hosted/simple
# 因为走的是内网 http（非 https），需要把主机标记为可信
trusted-host = NEXUS_HOST

[install]
trusted-host = NEXUS_HOST
